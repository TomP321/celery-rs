# Services needed only by the real-project checks; brokers come from the test lanes.
name: celery-rs-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_PASSWORD: e2e}
    ports: ["127.0.0.1:55432:5432"]
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:55017:27017"]
  memcached:
    image: memcached:alpine
    ports: ["127.0.0.1:55011:11211"]
  sqs:
    image: softwaremill/elasticmq-native
    ports: ["127.0.0.1:59324:9324"]
  dynamodb:
    image: amazon/dynamodb-local
    ports: ["127.0.0.1:55800:8000"]
  s3:
    image: motoserver/moto
    ports: ["127.0.0.1:55500:5000"]
