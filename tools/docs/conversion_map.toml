# Copertura dei ruoli a runtime, non percentuale di testo tradotto letteralmente.
# Conteggio: righe fisiche incluse righe vuote e commenti. Nei file misti Celery
# si contano simboli di ruoli scavalcati oppure le sole chiamate delegate.
# rust_calls usa simbolo|nome_chiamata; le righe sovrapposte contano una sola volta.
# Gli altri moduli Celery (canvas, trace, loader, ecc.) sono aggregati ad app.
# originale/assente esclusi dal denominatore globale, inclusi in quello per pacchetto.
