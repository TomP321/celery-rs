# Pacchetto Python drop-in: distribuzione `celery` (stesso nome e versione del riferimento,
# con versione locale `+rs`, che soddisfa i vincoli `celery==5.7.0rc1`) contenente il guscio
# Python `celery/` e il modulo nativo `_celery_rs`.
[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "celery"
version = "5.7.0rc1+rs.0.1.1"
description = "Distributed Task Queue (celery-rs: core in Rust, API identica a Celery)"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = [
    "billiard>=4.3.1",
    "kombu>=5.7.0rc1",
    "vine>=5.1.0,<6.0",
    "click>=8.3.1,<9.0",
    "click-didyoumean>=0.3.1",
    "click-repl==0.4.1",
    "click-plugins>=1.1.1.2",
    "python-dateutil==2.9.0.post0",
    "exceptiongroup>=1.3.1; python_version < '3.11'",
    "tzlocal",
]

[project.optional-dependencies]
# Stesse librerie di `kombu[redis]`, ma senza il pin `packaging==26.3` di kombu 5.7.0rc1
# (kombu usa packaging solo per confrontare versioni): evita conflitti con altre dipendenze.
redis = ["redis>=6.4.0,<9.0.0", "packaging"]
msgpack = ["kombu[msgpack]"]
yaml = ["kombu[yaml]"]

[project.scripts]
celery = "celery.__main__:main"

[tool.maturin]
manifest-path = "crates/celery-py/Cargo.toml"
module-name = "_celery_rs._celery_rs"
python-source = "python"
python-packages = ["celery"]
features = ["pyo3/extension-module"]
