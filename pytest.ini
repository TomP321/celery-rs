[pytest]
# Il plugin pytest-celery importa `celery` durante il caricamento degli
# entry point, prima dei conftest: dalla root del repo la directory `celery/`
# (sorgente di riferimento) sarebbe un namespace package. I test differenziali
# importano il riferimento esplicitamente in tests/conftest.py.
addopts = -p no:celery
pythonpath = celery
