[package]
name = "celery-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_celery_rs"
crate-type = ["cdylib"]

[features]
# Solo diagnostica: nessun costo atomico nei percorsi di produzione.
memory-probe = []

[dependencies]
bytes.workspace = true
celery-backend.workspace = true
celery-beat.workspace = true
celery-proto.workspace = true
celery-transport.workspace = true
celery-worker.workspace = true
compact_str.workspace = true
futures-core.workspace = true
libc.workspace = true
pyo3.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[build-dependencies]
pyo3-build-config.workspace = true
