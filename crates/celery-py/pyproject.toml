# Installs only _celery_rs beside reference Celery for differential tests.
# The root pyproject.toml defines the complete package.
[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "celery-rs-native"
version = "0.1.0"
requires-python = ">=3.10"

[tool.maturin]
module-name = "_celery_rs"
features = ["pyo3/extension-module"]
