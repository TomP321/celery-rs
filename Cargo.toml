[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.99"

[workspace.dependencies]
celery-proto = { path = "crates/celery-proto" }
celery-transport = { path = "crates/celery-transport" }
celery-backend = { path = "crates/celery-backend" }
celery-worker = { path = "crates/celery-worker" }
celery-beat = { path = "crates/celery-beat" }

bytes = "1.12"
brotli = "9"
bzip2 = "0.5"
flate2 = "1"
futures-core = "0.3"
itoa = "1"
ryu = "1"
xz2 = "0.1"
zstd = "0.13"
compact_str = { version = "0.10", features = ["serde"] }
hashbrown = "0.17"
lapin = "4.12"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
# `extension-module` is enabled only by maturin (`pyo3/extension-module`): enabling it here
# would stop `cargo test` from linking libpython into test binaries.
pyo3 = { version = "0.30", features = ["abi3-py310"] }
pyo3-build-config = "0.30"
proptest = "1"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "aio", "script", "streams", "tokio-rustls-comp"] }
# Explicit crypto provider for `rediss://`: without a rustls feature the client panics when
# building the TLS config.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
thiserror = "2"
tokio = { version = "1.54", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[profile.release]
# Smaller resident code; latency is checked by the benchmarks.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.celery-beat]
# Due-time computation stays hot; everything else favours fewer resident pages.
opt-level = 3

# Release with symbols and panic=unwind (PyO3 tests need unwinding).
[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
panic = "unwind"
